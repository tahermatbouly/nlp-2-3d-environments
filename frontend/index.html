<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor plan assistant</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f6f4; --text: #1f1f1d; --muted: #6b6b66;
    --user: #1f1f1d; --user-text: #ffffff; --border: #e3e3de; --accent: #c15f3c;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --panel: #262624; --text: #ececE8; --muted: #9b9b94;
      --user: #ececE8; --user-text: #1c1c1a; --border: #3a3a36; --accent: #e08a68;
      --error: #f2877f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
  select, .btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap;
    word-wrap: break-word; unicode-bidi: plaintext;
  }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .user .bubble { background: var(--user); color: var(--user-text); }
  .bubble.error { color: var(--error); border-color: var(--error); background: transparent; }
  .typing { display: inline-flex; gap: 4px; padding: 14px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  #quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  #quick:empty { display: none; }
  #quick button {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #quick button:hover { background: var(--accent); color: var(--bg); }
  #composer {
    display: flex; align-items: flex-end; gap: 8px; margin: 8px 16px 16px; padding: 8px;
    border: 1px solid var(--border); border-radius: 22px; background: var(--panel);
  }
  #input {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; max-height: 160px; padding: 6px 8px; unicode-bidi: plaintext;
  }
  .icon {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon:disabled { opacity: .45; cursor: not-allowed; }
  #send { background: var(--user); color: var(--user-text); }
  #send:disabled { opacity: .35; }
  details.graph { margin-top: 8px; font-size: 13px; }
  details.graph pre { overflow-x: auto; direction: ltr; text-align: left; margin: 8px 0 0; }
</style>
</head>
<body>
  <header>
    <h1>Floor plan assistant</h1>
    <select id="lang" title="Language of the assistant">
      <option value="ar_eg">عربي (مصري)</option>
      <option value="en">English</option>
    </select>
    <button class="btn" id="newChat">New chat</button>
  </header>

  <div id="log" aria-live="polite"></div>
  <div id="quick"></div>

  <div id="composer">
    <textarea id="input" rows="1" dir="auto" placeholder="Describe your apartment…"></textarea>
    <!-- Reserved for later: dictation and voice mode. -->
    <button class="icon" id="mic" disabled title="Dictation (coming soon)" aria-label="Dictation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="icon" id="wave" disabled title="Voice mode (coming soon)" aria-label="Voice mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
    </button>
    <button class="icon" id="send" title="Send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), quick = $("quick");

let sessionId = localStorage.getItem("session_id");
let busy = false;
let finished = false;

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const error = new Error(body.detail || res.statusText);
    error.status = res.status;
    throw error;
  }
  return res.json();
}

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addBubble(role, text, extraClass = "") {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble " + extraClass;
  bubble.dir = "auto";
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  scrollDown();
  return row;
}

function setTyping(on) {
  const existing = $("typing");
  if (existing) existing.remove();
  if (!on) return;
  const row = document.createElement("div");
  row.className = "row assistant";
  row.id = "typing";
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  log.appendChild(row);
  scrollDown();
}

function renderQuick(replies) {
  quick.innerHTML = "";
  if (finished) return;
  for (const text of replies || []) {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = () => send(text);
    quick.appendChild(b);
  }
}

function renderDone(data) {
  finished = !!data.done;
  input.disabled = finished;
  sendBtn.disabled = finished;
  if (!finished) return;
  if (data.room_graph) {
    const row = addBubble("assistant", "");
    const details = document.createElement("details");
    details.className = "graph";
    details.innerHTML = "<summary>Room graph (JSON)</summary>";
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(data.room_graph, null, 2);
    details.appendChild(pre);
    row.firstChild.appendChild(details);
  }
}

function applyReply(data) {
  addBubble("assistant", data.message.text);
  renderQuick(data.quick_replies);
  renderDone(data);
}

async function startSession() {
  log.innerHTML = "";
  quick.innerHTML = "";
  finished = false;
  input.disabled = false;
  sendBtn.disabled = false;
  setTyping(true);
  try {
    const data = await api("/sessions", {
      method: "POST",
      body: JSON.stringify({ language: $("lang").value }),
    });
    sessionId = data.session_id;
    localStorage.setItem("session_id", sessionId);
    setTyping(false);
    applyReply(data);
  } catch (e) {
    setTyping(false);
    addBubble("assistant", e.message, "error");
  }
  input.focus();
}

async function restoreSession() {
  try {
    const data = await api("/sessions/" + sessionId);
    $("lang").value = data.language;
    for (const m of data.messages) addBubble(m.role, m.text);
    renderQuick(data.quick_replies);
    renderDone(data);
  } catch (e) {
    await startSession();
  }
}

async function send(text) {
  text = (text ?? input.value).trim();
  if (!text || busy || finished) return;
  busy = true;
  sendBtn.disabled = true;
  quick.innerHTML = "";
  addBubble("user", text);
  input.value = "";
  autosize();
  setTyping(true);
  try {
    const data = await api("/sessions/" + sessionId + "/messages", {
      method: "POST",
      body: JSON.stringify({ text }),
    });
    setTyping(false);
    applyReply(data);
  } catch (e) {
    setTyping(false);
    addBubble("assistant", e.message, "error");
    input.value = text;   // let the user resend
  } finally {
    busy = false;
    sendBtn.disabled = finished;
    input.focus();
  }
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
sendBtn.onclick = () => send();
$("newChat").onclick = startSession;

sessionId ? restoreSession() : startSession();
</script>
</body>
</html>
