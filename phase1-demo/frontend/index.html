<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            padding: 24px;
            color: #1a1a2e;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a1a2e;
        }

        h2 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8e8ee;
        }

        .container {
            display: flex;
            max-width: 1300px;
            margin: 0 auto;
            gap: 20px;
        }

        /* --- Chat Panel --- */
        .panel {
            flex: 1;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex: 1;
            min-height: 280px;
            max-height: 340px;
            overflow-y: auto;
            border: 1px solid #e8e8ee;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #fafbfc;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d0d0d8;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input input:focus {
            border-color: #4a7cff;
            box-shadow: 0 0 0 3px rgba(74, 124, 255, 0.12);
        }

        .chat-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .chat-input button:active { transform: scale(0.97); }

        .btn-send {
            background: #4a7cff;
            color: white;
        }
        .btn-send:hover { background: #3a65d4; }

        .btn-reset {
            background: #ff5252;
            color: white;
        }
        .btn-reset:hover { background: #d43d3d; }

        .message {
            margin-bottom: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 85%;
        }
        .user-msg {
            background: #e3f0ff;
            color: #1a3a6b;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 3px;
        }
        .sys-msg {
            background: #eef7ee;
            color: #2a5a2a;
            margin-right: auto;
            border-bottom-left-radius: 3px;
        }

        #loading {
            display: none;
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            padding: 8px 0;
        }
        #loading .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ccc;
            border-top-color: #4a7cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- State & Diagram Panel --- */
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-incomplete {
            background: #fce4e4;
            color: #c0392b;
        }
        .status-complete {
            background: #e8f8e8;
            color: #27ae60;
        }

        pre {
            background: #f5f5fa;
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.82rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            line-height: 1.5;
            border: 1px solid #e8e8ee;
            max-height: 220px;
            overflow-y: auto;
        }

        #bubble-diagram {
            height: 500px;
            border: 1px solid #e8e8ee;
            border-radius: 8px;
            background: #fafbfc;
            position: relative;
        }
        #bubble-diagram .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            font-size: 0.95rem;
        }
        #bubble-diagram .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .section-gap { margin-top: 20px; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f5f5fa;
            border-radius: 8px;
            border: 1px solid #e8e8ee;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: #555;
        }
        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid;
        }
    </style>
</head>
<body>

    <h1>🏠 Apartment Requirement Extraction</h1>

    <div class="container">
        <!-- Chat Panel -->
        <div class="panel">
            <h2>💬 Chat Interface</h2>
            <div class="chat-history" id="chat-history"></div>
            <div id="loading"><span class="spinner"></span>Waiting for model response...</div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="E.g., I want 2 bedrooms and a kitchen..." onkeypress="handleEnter(event)">
                <button class="btn-send" onclick="sendMessage()">Send</button>
                <button class="btn-reset" onclick="resetState()">Reset</button>
            </div>
        </div>

        <!-- State & Diagram Panel -->
        <div class="panel">
            <h2>📋 Extracted State</h2>
            <p style="margin-bottom: 10px;">
                <strong>Status:</strong>
                <span id="completion-status" class="status-badge status-incomplete">Incomplete</span>
            </p>
            <pre id="json-state">{}</pre>

            <div class="section-gap">
                <h2>🔗 Bubble Diagram</h2>
                <div id="bubble-diagram">
                    <div class="empty-state">
                        <div class="icon">🏗️</div>
                        <div>No rooms yet. Start chatting to build your apartment.</div>
                    </div>
                </div>
                <div class="legend" id="legend"></div>
            </div>
        </div>
    </div>

    <script>
        const sessionId = "default";
        const chatHistory = document.getElementById("chat-history");
        const jsonState = document.getElementById("json-state");
        const completionStatus = document.getElementById("completion-status");
        const loading = document.getElementById("loading");

        // Color map for room types
        const ROOM_COLORS = {
            bedroom:     { background: '#BBDEFB', border: '#1976D2', label: 'Bedroom' },
            bathroom:    { background: '#B2DFDB', border: '#00796B', label: 'Bathroom' },
            kitchen:     { background: '#FFF9C4', border: '#F9A825', label: 'Kitchen' },
            living_room: { background: '#FFCCBC', border: '#E64A19', label: 'Living Room' },
            dining_room: { background: '#E1BEE7', border: '#7B1FA2', label: 'Dining Room' },
            hallway:     { background: '#CFD8DC', border: '#455A64', label: 'Hallway' },
            balcony:     { background: '#C8E6C9', border: '#388E3C', label: 'Balcony' },
            laundry:     { background: '#F0F4C3', border: '#9E9D24', label: 'Laundry' },
            default:     { background: '#E0E0E0', border: '#757575', label: 'Other' },
        };

        let currentNetwork = null;

        function addMessage(text, isUser) {
            const div = document.createElement("div");
            div.className = "message " + (isUser ? "user-msg" : "sys-msg");
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function getRoomColor(type) {
            return ROOM_COLORS[type] || ROOM_COLORS.default;
        }

        function renderLegend(rooms) {
            const legendEl = document.getElementById('legend');
            const typesUsed = new Set(rooms.map(r => r.type));
            let html = '';
            typesUsed.forEach(type => {
                const color = getRoomColor(type);
                const displayName = color.label || type.replace(/_/g, ' ');
                html += `<div class="legend-item">
                    <span class="legend-swatch" style="background:${color.background};border-color:${color.border};"></span>
                    ${displayName}
                </div>`;
            });
            // Add door legend
            html += `<div class="legend-item">🚪 Door (connection)</div>`;
            legendEl.innerHTML = html;
        }

        function renderGraph(state) {
            const container = document.getElementById('bubble-diagram');

            if (!state || !state.rooms || state.rooms.length === 0) {
                // Destroy previous network
                if (currentNetwork) {
                    currentNetwork.destroy();
                    currentNetwork = null;
                }
                container.innerHTML = `<div class="empty-state">
                    <div class="icon">🏗️</div>
                    <div>No rooms yet. Start chatting to build your apartment.</div>
                </div>`;
                document.getElementById('legend').innerHTML = '';
                return;
            }

            // Clear container
            container.innerHTML = '';

            // Find the hub room (most connections)
            let hubId = state.rooms[0].id;
            let maxConns = 0;
            state.rooms.forEach(room => {
                if (room.connections && room.connections.length > maxConns) {
                    maxConns = room.connections.length;
                    hubId = room.id;
                }
            });

            // Build nodes
            const nodes = state.rooms.map(room => {
                const colors = getRoomColor(room.type);
                const sizeLabel = room.size ? `\n(${room.size})` : '';
                const displayType = room.type.replace(/_/g, ' ');
                const isHub = room.id === hubId;
                return {
                    id: room.id,
                    label: displayType + sizeLabel,
                    title: `${displayType}${room.size ? ' — ' + room.size : ''}\nConnections: ${(room.connections || []).length}`,
                    color: {
                        background: colors.background,
                        border: colors.border,
                        highlight: { background: colors.background, border: colors.border },
                        hover: { background: colors.background, border: colors.border }
                    },
                    font: {
                        size: isHub ? 16 : 14,
                        face: 'Inter, system-ui, sans-serif',
                        color: '#222',
                        bold: isHub ? { color: '#111', size: 16 } : undefined,
                        multi: 'md'
                    },
                    shape: 'circle',
                    size: isHub ? 50 : 38,
                    borderWidth: isHub ? 3 : 2,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.1)',
                        size: 6,
                        x: 2,
                        y: 2
                    },
                    // Pin the hub to center
                    ...(isHub ? { x: 0, y: 0, fixed: { x: true, y: true } } : {})
                };
            });

            // Build edges (deduplicated)
            const edgeSet = new Set();
            const edges = [];
            state.rooms.forEach(room => {
                if (!room.connections) return;
                room.connections.forEach(connId => {
                    const key = [room.id, connId].sort().join('--');
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({
                            from: room.id,
                            to: connId,
                            label: '🚪',
                            font: { size: 16, strokeWidth: 0, vadjust: 0 },
                            color: { color: '#aaa', highlight: '#555', hover: '#777' },
                            width: 2,
                            smooth: { type: 'continuous' },
                            hoverWidth: 0.5
                        });
                    }
                });
            });

            const data = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };

            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        centralGravity: 0.02,
                        springLength: 180,
                        springConstant: 0.05,
                        damping: 0.4,
                        avoidOverlap: 0.6
                    },
                    stabilization: { iterations: 250, fit: true }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 150,
                    zoomView: true,
                    dragNodes: true,
                    dragView: true
                },
                nodes: {
                    shape: 'circle'
                },
                edges: {
                    smooth: { type: 'continuous' }
                }
            };

            // Destroy previous network before creating new one
            if (currentNetwork) {
                currentNetwork.destroy();
            }
            currentNetwork = new vis.Network(container, data, options);

            // After stabilization, release the hub so user can drag it too
            currentNetwork.once('stabilizationIterationsDone', function() {
                currentNetwork.setOptions({ physics: { enabled: false } });
                // Unfix hub so user can drag it
                const hubNode = nodes.find(n => n.id === hubId);
                if (hubNode) {
                    data.nodes.update({ id: hubId, fixed: false });
                }
            });

            // Render legend
            renderLegend(state.rooms);
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            addMessage(text, true);
            loading.style.display = "block";

            // Use AbortController with 10-minute timeout to match backend's Ollama timeout
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 600000);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: sessionId }),
                    signal: controller.signal
                });

                if (response.ok) {
                    const data = await response.json();

                    // Update JSON view
                    jsonState.textContent = JSON.stringify(data.state, null, 2);

                    // Update completion status
                    if (data.is_complete) {
                        completionStatus.textContent = "Complete ✓";
                        completionStatus.className = "status-badge status-complete";
                    } else {
                        completionStatus.textContent = "Incomplete";
                        completionStatus.className = "status-badge status-incomplete";
                    }

                    // Add system message
                    addMessage(data.message, false);
                    if (data.is_complete) {
                        addMessage("✅ Minimum requirements met!", false);
                    }

                    // Render interactive graph
                    renderGraph(data.state);
                } else {
                    addMessage("Error calling API.", false);
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    addMessage("Request timed out. The model may be overloaded.", false);
                } else {
                    addMessage("Network error.", false);
                }
            } finally {
                clearTimeout(timeoutId);
                loading.style.display = "none";
            }
        }

        async function resetState() {
            try {
                await fetch(`/reset/${sessionId}`, { method: "POST" });
                chatHistory.innerHTML = "";
                jsonState.textContent = "{}";
                completionStatus.textContent = "Incomplete";
                completionStatus.className = "status-badge status-incomplete";
                renderGraph({ rooms: [], requirements: {} });
                addMessage("State has been reset.", false);
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
